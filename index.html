<!DOCTYPE html>

    <title>Menu Food</title>
    <link rel="stylesheet" href="style.css">

<body>

    <!-- Navigasi Tab -->
    <header>
        <nav class="nav-tabs">
            <a href="index.html" class="active">Food</a>

        </div>
        <!-- Item 2 -->
        <div class="menu-card">
            <div class="price-tag">18k</div>

        </div>

        <div class="menu-card">
            <div class="price-tag">15k</div>

            <div class="menu-name">Nasi Goreng</div>
        </div>
        <!-- Item 6 -->
        <div class="menu-card">
            <div class="price-tag">18k</div>
            <div class="image-wrapper"><img src="soto.jpg" alt="Soto Ayam"></div>
            <div class="menu-name">Soto Ayam</div>
        </div>

            <p>+62 882-4217-6982 (isma)</p>
